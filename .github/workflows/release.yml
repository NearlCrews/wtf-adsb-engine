name: Release engine

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: false
      # uv's download index skips some patch releases, so the runner takes any 3.14.
      - run: uv python install 3.14
      - run: echo "UV_PYTHON=3.14" >> "$GITHUB_ENV"
      - run: uv sync --locked --extra dev --extra archive
      - name: Check the tag and write the release notes
        run: |
          version="$(.venv/bin/python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
            exit 1
          fi
          # PEP 440 decides: 0.2.0rc1, 0.2.0b1, 0.2.0.dev1, and 0.2.0-rc.1 are all
          # pre-releases. An invalid version fails the step.
          kind="$(.venv/bin/python -c 'import sys; from packaging.version import Version; print("pre-release" if Version(sys.argv[1]).is_prerelease else "release")' "$version")"
          echo "RELEASE_KIND=$kind" >> "$GITHUB_ENV"
          repository="${GITHUB_REPOSITORY,,}"
          echo "IMAGE=ghcr.io/$repository:$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          echo "LATEST=ghcr.io/$repository:latest" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release"
          .venv/bin/python tools/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release/notes.md"
      - run: make check
        env:
          UV_OFFLINE: "1"
      - run: make image IMAGE="$IMAGE"
      - run: make test-image IMAGE="$IMAGE"
      - name: Extract the image inventories
        run: |
          container="$(docker create "$IMAGE")"
          trap 'docker rm "$container" > /dev/null' EXIT
          for name in build.json packages.json; do
            docker cp "$container:/usr/local/share/wtf-adsb-engine/$name" "$RUNNER_TEMP/release/$name"
          done
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the version tag
        run: |
          docker push "$IMAGE"
          digest="$(docker buildx imagetools inspect "$IMAGE" | awk '$1 == "Digest:" { print $2; exit }')"
          if [ -z "$digest" ]; then
            echo "Could not read the pushed image digest" >&2
            exit 1
          fi
          image="${IMAGE%:*}@$digest"
          {
            echo "## Container image"
            echo
            echo "- Tag: \`$IMAGE\`"
            echo "- Digest: \`$image\`"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "### Container image"
            echo
            echo "\`$image\`, also tagged \`$IMAGE\`."
          } >> "$RUNNER_TEMP/release/notes.md"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [ "$RELEASE_KIND" = "pre-release" ]; then
            prerelease=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag "${prerelease[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release/notes.md" \
            "$RUNNER_TEMP/release/build.json" \
            "$RUNNER_TEMP/release/packages.json" \
            dist/wtf_adsb_engine-*.tar.gz \
            dist/wtf_adsb_engine-*.whl
      - name: Move latest to the released image
        run: |
          if [ "$RELEASE_KIND" = "pre-release" ]; then
            echo "Pre-release $GITHUB_REF_NAME does not move latest"
            exit 0
          fi
          docker tag "$IMAGE" "$LATEST"
          docker push "$LATEST"
          echo "- Also tagged: \`$LATEST\`" >> "$GITHUB_STEP_SUMMARY"
