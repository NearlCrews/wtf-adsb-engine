name: Check engine

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          enable-cache: false
      # uv's download index skips some patch releases, so the runner takes any 3.14.
      - run: uv python install 3.14
      - run: echo "UV_PYTHON=3.14" >> "$GITHUB_ENV"
      - run: uv sync --locked --extra dev --extra archive
      - run: make check
        env:
          UV_OFFLINE: "1"
      - run: make image IMAGE=wtf-adsb-engine:check
      - run: make test-image IMAGE=wtf-adsb-engine:check
