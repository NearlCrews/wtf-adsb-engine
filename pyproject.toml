[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "wtf-adsb-engine"
version = "0.1.0"
description = "Modular ADS-B analysis and durable evidence export"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.14"
dependencies = ["jsonschema==4.26.0", "packaging==26.3"]
authors = [{ name = "Nearl Crews" }]
keywords = ["ads-b", "aircraft", "telemetry", "plugins"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/NearlCrews/wtf-adsb-engine"
"Example deployment" = "https://wtf-adsb.com"
Source = "https://github.com/NearlCrews/wtf-adsb-engine"
Issues = "https://github.com/NearlCrews/wtf-adsb-engine/issues"
Changelog = "https://github.com/NearlCrews/wtf-adsb-engine/blob/main/CHANGELOG.md"

[project.optional-dependencies]
archive = ["numpy==2.5.4"]
dev = ["build==1.6.1", "hatchling==1.33.0", "ruff==0.17.4", "numpy==2.5.4"]

[project.scripts]
wtf-adsb-engine = "wtf_adsb_engine.cli:main"
wtf-adsb-backfill-history = "wtf_adsb_engine.analysis.backfill_history:main"
wtf-adsb-backfill-metrics = "wtf_adsb_engine.analysis.backfill_metrics:main"
wtf-adsb-import-replay = "wtf_adsb_engine.analysis.import_replay:main"

[project.entry-points."wtf_adsb_engine.inputs"]
"wtf_adsb.receiver_json" = "wtf_adsb_engine.builtins.io:ReceiverInput"
"wtf_adsb.receiver_service" = "wtf_adsb_engine.builtins.receiver:ReceiverService"
"wtf_adsb.json_replay" = "wtf_adsb_engine.builtins.io:ReplayInput"
"wtf_adsb.journal" = "wtf_adsb_engine.builtins.io:JournalInput"

[project.entry-points."wtf_adsb_engine.detectors"]
"wtf_adsb.collection" = "wtf_adsb_engine.builtins.collection:CollectionDetector"

[project.entry-points."wtf_adsb_engine.formats"]
"wtf_adsb.json" = "wtf_adsb_engine.builtins.io:JsonFormat"

[project.entry-points."wtf_adsb_engine.references"]
"wtf_adsb.json_reference" = "wtf_adsb_engine.builtins.enrichment:JsonReference"

[project.entry-points."wtf_adsb_engine.enrichers"]
"wtf_adsb.reference_match" = "wtf_adsb_engine.builtins.enrichment:ReferenceMatch"

[project.entry-points."wtf_adsb_engine.outputs"]
"wtf_adsb.files" = "wtf_adsb_engine.builtins.io:FileOutput"

[tool.hatch.build.targets.wheel]
packages = ["src/wtf_adsb_engine"]

[tool.hatch.build]
exclude = [".private", ".venv", "state", "dist", "artifacts", "*.sqlite*", "*.db", "*.log", ".env", ".env.*", "*.pem", "*.key", "**/__pycache__"]

[tool.ruff]
target-version = "py314"
line-length = 110
# The setup tool runs on the host's own Python, which may be older than the engine's.
per-file-target-version = { "tools/setup.py" = "py311" }

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
